params:
    - id: bucket
      type: string
      name: "Fleet bucket"
      description: "S3-compatible bucket that holds deployments and cell state, e.g. s3://my-cells-bucket (gs:// and az:// are accepted too). Required."
      default_value: ""

    - id: access_key_id
      type: secret
      name: "Access key ID"
      description: "AWS_ACCESS_KEY_ID for the bucket: R2/S3 access key id, or the GCS/Azure equivalent."
      default_value: ""

    - id: secret_access_key
      type: secret
      name: "Secret access key"
      description: "AWS_SECRET_ACCESS_KEY for the bucket."
      default_value: ""

    - id: session_token
      type: secret
      name: "Session token"
      description: "AWS_SESSION_TOKEN, only for temporary credentials. Leave empty otherwise."
      default_value: ""
      optional: true

    - id: endpoint
      type: string
      name: "S3 endpoint"
      description: "S3-compatible endpoint, e.g. https://ACCOUNT.r2.cloudflarestorage.com. Leave empty for AWS S3."
      default_value: ""
      optional: true

    - id: region
      type: string
      name: "Region"
      description: "Bucket region. Use auto for Cloudflare R2, leave us-east-1 for AWS S3."
      default_value: "us-east-1"
      optional: true

